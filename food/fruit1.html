<!--================== CSS ==================== -->

<style>
    h2 {
        text-align: center;
        /* Center the heading */
    }

    div {
        border: solid;
        /* Add border around each div */
        padding: 10px;
        /* Add space inside the div */
        width: 31%;
        /* Set div width */
        display: inline-block;
        /* Display divs next to each other */
        vertical-align: top;
        /* Align divs to the top */
    }

    img {
        width: 30%;
        /* Make image fill the div width */
        height: 500px;
        /* Set fixed image height */
    }

    button {
        cursor: pointer;
        /* Show pointer when hovering over button */
    }
</style>
